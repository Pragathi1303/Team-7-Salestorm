version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      RESERVATION_EXPIRY_SECONDS: ${RESERVATION_EXPIRY_SECONDS}
      QUEUE_ADMISSION_RATE: ${QUEUE_ADMISSION_RATE}
      DEMO_PRODUCT_SKU: ${DEMO_PRODUCT_SKU}
      DEMO_INITIAL_INVENTORY: ${DEMO_INITIAL_INVENTORY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "python -m app.core.init_db && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --workers 1"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      RESERVATION_EXPIRY_SECONDS: ${RESERVATION_EXPIRY_SECONDS}
      QUEUE_ADMISSION_RATE: ${QUEUE_ADMISSION_RATE}
      DEMO_PRODUCT_SKU: ${DEMO_PRODUCT_SKU}
      DEMO_INITIAL_INVENTORY: ${DEMO_INITIAL_INVENTORY}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --workers 1"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      RESERVATION_EXPIRY_SECONDS: ${RESERVATION_EXPIRY_SECONDS}
      DEMO_PRODUCT_SKU: ${DEMO_PRODUCT_SKU}
      DEMO_INITIAL_INVENTORY: ${DEMO_INITIAL_INVENTORY}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python -m app.workers.event_consumer

  expiry_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      RESERVATION_EXPIRY_SECONDS: ${RESERVATION_EXPIRY_SECONDS}
      DEMO_PRODUCT_SKU: ${DEMO_PRODUCT_SKU}
      DEMO_INITIAL_INVENTORY: ${DEMO_INITIAL_INVENTORY}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python -m app.workers.expiry_worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  grafana_data:
